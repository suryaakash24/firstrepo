<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Ranking</title>
  <style>
    :root{--bg:#f6f8fb;--card:#ffffff;--accent:#2563eb;--muted:#6b7280}
    *{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{margin:24px;background:var(--bg);color:#111}
    .container{max-width:900px;margin:0 auto}
    h1{font-size:1.4rem;margin:0 0 12px}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 20px rgba(16,24,40,0.06)}
    .controls{display:flex;gap:10px;align-items:center;margin-bottom:14px}
    .search{flex:1;display:flex}
    input[type="search"]{flex:1;padding:12px 14px;border:1px solid #d0d7e2;border-radius:14px;font-size:0.95rem;outline:none;}
    .meta{color:var(--muted);font-size:0.9rem}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    thead th{position:sticky;top:0;z-index:2;background:#f0f4ff;}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef2f7}
    th{background:linear-gradient(180deg,#fbfdff,#f8fbff);font-weight:600}
    tbody tr:nth-child(even){background:#f9fbff}
    tbody tr:hover{background:#eaf1ff}
    .rank{font-weight:700}
    .no-results{text-align:center;padding:18px;color:var(--muted)}
    @media (max-width:600px){th:nth-child(3),td:nth-child(3){display:none}} /* hide marks on small */
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Ranking</h1>

    <div class="card">
      <div class="controls">
        <div class="search">
          <input id="search" type="search" placeholder="Search by Roll No or Name..." aria-label="Search students">
        </div>
        <div class="meta">Showing <span id="count">0</span> students</div>
      </div>

      <div id="tableWrap">
        <table id="studentsTable" aria-describedby="tableDescription">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Marks</th>
              <th>Rank</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows inserted by JS -->
          </tbody>
        </table>
        <div id="noResults" class="no-results" style="display:none">No students match your search.</div>
      </div>

      <p id="tableDescription" style="display:none">This table lists students with their roll number, marks and computed rank (1 = highest marks).</p>
    </div>
  </div>

  <script>
    // --- Live Data from Table ---
    function getStudentsFromTable(){
      const rows = document.querySelectorAll('#studentsTable tbody tr');
      const arr = [];
      rows.forEach(r => {
        const cells = r.querySelectorAll('td');
        arr.push({
          roll: cells[0].textContent.trim(),
          name: cells[1].textContent.trim(),
          marks: parseInt(cells[2].querySelector('input')?.value || cells[2].textContent.trim())
        });
      });
      return arr;
    }

    // Compute ranks
    function computeRanks(data){
      const sorted = [...data].sort((a,b)=>b.marks - a.marks);
      let rank = 1, prev = null;
      const map = new Map();
      for(let i=0;i<sorted.length;i++){
        if(sorted[i].marks !== prev) rank = i+1;
        map.set(sorted[i].roll, rank);
        prev = sorted[i].marks;
      }
      return map;
    }

    // Render rows
    function renderTable(list){
      const tbody = document.querySelector('#studentsTable tbody');
      tbody.innerHTML = '';
      list.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.roll}</td>
          <td>${s.name}</td>
          <td><input type="number" value="${s.marks}" style="width:70px;padding:4px;"></td>
          <td class="rank">-</td>`;
        tbody.appendChild(tr);
      });
      document.getElementById('count').textContent = list.length;
    }

    function doSearch(term){
      term = term.toLowerCase();
      const all = students;
      if(!term) return all;
      return all.filter(s => s.roll.toLowerCase().includes(term) || s.name.toLowerCase().includes(term));
    }

    // INITIAL
    let students = [
      { roll:'101', name:'Aisha Khan', marks:88 },
      { roll:'102', name:'Rohit Sharma', marks:95 },
      { roll:'103', name:'Meera Patel', marks:95 },
      { roll:'104', name:'Sanjay Verma', marks:72 },
      { roll:'105', name:'Priya Singh', marks:81 },
      { roll:'106', name:'Arjun Das', marks:66 },
      { roll:'107', name:'Neha Gupta', marks:88 }
    ];

    document.addEventListener('DOMContentLoaded', ()=>{
      renderTable(students);

      // Live search
      document.getElementById('search').addEventListener('input', e => {
        const filtered = doSearch(e.target.value);
        renderTable(filtered);
      });

      // Calculate Rank button
      document.querySelector('.controls').insertAdjacentHTML('beforeend', `
        <button id="rankBtn" style="padding:8px 16px;border-radius:10px;border:none;background:#2563eb;color:white;cursor:pointer;">Calculate Rank</button>`);

      document.getElementById('rankBtn').addEventListener('click', ()=>{
        // Update students array from table
        students = getStudentsFromTable();

        // Recalculate ranks
        const ranks = computeRanks(students);

        // Update DOM
        document.querySelectorAll('#studentsTable tbody tr').forEach(row => {
          const roll = row.children[0].textContent.trim();
          row.querySelector('.rank').textContent = ranks.get(roll);
        });
      });
    });
  </script>
</body>
</html>
